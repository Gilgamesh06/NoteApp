server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index html/index.html;

    # Ruta principal
    location / {
        try_files $uri $uri/ /html/index.html =404;
    }

    # Rutas para los assets estáticos
    location /css/ {
        alias /usr/share/nginx/html/css/;
    }

    location /js/ {
        alias /usr/share/nginx/html/js/;
    }
}

